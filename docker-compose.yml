# Full multi-container stack for Docent/documind (Plan.md Phase 10): Postgres+pgvector, the
# Python gateway, the Java app, and Redis. `docker compose up -d` alone now runs the whole
# system — no more "run the Java app on the host separately."
#
# The pgvector/pgvector image is stock PostgreSQL with the `vector` extension already compiled
# in, so `CREATE EXTENSION vector` just works on startup. No manual extension install (unlike
# the local EDB PostgreSQL).
#
# NOTE: host ports 5432/8000/8080 must be free. If a local PostgreSQL is running it owns 5432 —
# stop it first (or change the left-hand port below and SPRING_DATASOURCE_URL).
#
# `.env` (git-ignored, see .env.example) must define INTERNAL_API_KEY, GROQ_API_KEY, JWT_SECRET.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: documind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: documind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - documind_pgdata:/var/lib/postgresql/data
    healthcheck:
      # Waits until the server is actually accepting connections.
      test: ["CMD-SHELL", "pg_isready -U postgres -d documind"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Python Embedding & LLM Gateway (Plan.md Phase 3). Text in -> embedding out,
  # prompt in -> Groq completion out. No DB access, no permissions.
  # The Java app runs on the host and reaches this at http://localhost:8000.
  gateway:
    build: ./gateway
    container_name: documind-gateway
    restart: unless-stopped
    environment:
      # Shared secret checked on every request; must match the app's INTERNAL_API_KEY.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY in .env}
      # Phase 4: /retrieve queries pgvector directly (postgres is the compose service name).
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/documind
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  documind_pgdata:
