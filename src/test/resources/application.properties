# Test-only overrides (auto-loaded by @SpringBootTest, layered over the main config).
# SecurityBeans fails loud on an empty/short JWT secret, so context load needs one here.
documind.jwt.secret=test-jwt-secret-at-least-32-bytes-long-00000

# No Python gateway during tests: embeddings fall back to the local ONNX model and the
# LLM is stubbed per-test. See ChatIntegrationTest / DocumentIngestionIntegrationTest.
documind.gateway.enabled=false

# Groq/OpenAI chat bean still constructs at context load; a dummy key keeps it happy.
spring.ai.openai.api-key=sk-test-not-used
