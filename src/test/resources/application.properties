# Test-only overrides (auto-loaded by @SpringBootTest, layered over the main config).
# NOTE: this file fully SHADOWS the main application.properties on the test classpath,
# so anything the context needs must be repeated here — datasource, gateway config, etc.

# SecurityBeans fails loud on an empty/short JWT secret, so context load needs one here.
documind.jwt.secret=test-jwt-secret-at-least-32-bytes-long-00000

# Pull INTERNAL_API_KEY (the shared gateway secret) from the git-ignored .env, so the
# tests authenticate to the running Python gateway with the same key it expects.
spring.config.import=optional:file:.env[.properties]

# All AI/vector work runs in the Python gateway (Phase 3–5.5). @SpringBootTest integration
# tests that ingest need a real, running gateway at :8000 + the pgvector DB.
documind.gateway.base-url=http://localhost:8000
documind.gateway.api-key=${INTERNAL_API_KEY:}

# Same local Postgres the app uses (docker compose). Repeated here because this file shadows
# main; without the datasource the context fails with "'url' attribute is not specified".
spring.datasource.url=jdbc:postgresql://localhost:5432/documind
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
