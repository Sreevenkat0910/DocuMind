spring.application.name=documind

# ---- Local environment file (secrets) ----
# Loads key=value pairs from a git-ignored .env at the project root, so ${JWT_SECRET} and
# ${INTERNAL_API_KEY} below resolve from it in local dev. "optional:" means the app still
# starts without the file (e.g. in prod, where the value comes from a real OS env var).
# Real OS env vars take precedence over .env, matching standard 12-factor config.
# (GROQ_API_KEY lives in .env too, but it's consumed by the Python gateway, not Java.)
spring.config.import=optional:file:.env[.properties]

# ---- Datasource (PostgreSQL + pgvector) ----
# Parameterized (Phase 10) so the containerized app (docker-compose service name "postgres")
# and CI can point elsewhere; local dev is unaffected since the default is unchanged.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/documind}
spring.datasource.username=postgres
spring.datasource.password=postgres

# ---- Auth (Phase 2: JWT) ----
# HS256 signing secret. MUST be >= 32 bytes and MUST come from the environment (JWT_SECRET
# in .env locally). Empty here so the app fails loud at startup if it isn't provided.
documind.jwt.secret=${JWT_SECRET:}
documind.jwt.ttl-minutes=60

# ---- File uploads ----
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# ---- Document storage (local disk; see FileStorageService) ----
documind.storage.location=storage

# ---- JPA ----
# Our relational entities (document_chunks, etc.) are the source of truth.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Python Embedding & LLM Gateway (Plan.md Phase 3–5.5) ----
# ALL AI/vector work — embeddings, vector search, LLM generation, RAG assembly, and the
# vector-store writes + schema — lives in the FastAPI gateway. Java has no AI/vector code
# and no Spring AI dependency; it only orchestrates and re-verifies. Every call carries the
# shared X-Internal-Api-Key, which must match the gateway's INTERNAL_API_KEY.
documind.gateway.base-url=${DOCUMIND_GATEWAY_URL:http://localhost:8000}
documind.gateway.api-key=${INTERNAL_API_KEY:}

# ---- Observability (Plan.md Phase 7) ----
# CorrelationIdFilter puts the request's correlation id in MDC; this pattern surfaces it in
# every log line, so `grep <id> app.log` shows one request's full story on the Java side, and
# `docker logs documind-gateway | grep <id>` shows the matching per-stage trace in Python.
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{correlationId}] %logger{35} - %msg%n

# ---- Resilience (Plan.md Phase 10) ----
# One named instance ("gateway") shared by every GatewayClient call: 3 attempts with backoff
# for transient network blips / 5xx, and a circuit breaker that opens after the gateway keeps
# failing so a dead Python service fails fast instead of every request hanging through 3 retries.
# Only network/5xx errors are retried — 4xx (bad request/auth) would just fail again identically.
resilience4j.retry.instances.gateway.max-attempts=3
resilience4j.retry.instances.gateway.wait-duration=200ms
resilience4j.retry.instances.gateway.enable-exponential-backoff=true
resilience4j.retry.instances.gateway.exponential-backoff-multiplier=2
resilience4j.retry.instances.gateway.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException

resilience4j.circuitbreaker.instances.gateway.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.gateway.sliding-window-size=10
resilience4j.circuitbreaker.instances.gateway.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.gateway.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.gateway.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.gateway.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.gateway.record-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException,com.fruity.documind.gateway.GatewayClient$UncheckedGatewayException
