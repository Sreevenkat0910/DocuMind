spring.application.name=documind

# ---- Local environment file (secrets) ----
# Loads key=value pairs from a git-ignored .env at the project root, so ${GEMINI_API_KEY}
# below resolves from it in local dev. "optional:" means the app still starts without the
# file (e.g. in prod, where the value comes from a real OS environment variable instead).
# Real OS env vars take precedence over .env, matching standard 12-factor config.
spring.config.import=optional:file:.env[.properties]

# ---- Datasource (PostgreSQL + pgvector) ----
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/documind
spring.datasource.username=postgres
spring.datasource.password=postgres

# ---- Auth (Phase 2: JWT) ----
# HS256 signing secret. MUST be >= 32 bytes and MUST come from the environment (JWT_SECRET
# in .env locally). Empty here so the app fails loud at startup if it isn't provided.
documind.jwt.secret=${JWT_SECRET:}
documind.jwt.ttl-minutes=60

# ---- File uploads ----
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# ---- Document storage (local disk; see FileStorageService) ----
documind.storage.location=storage

# ---- JPA ----
# Our relational entities (document_chunks, etc.) are the source of truth.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Spring AI: Groq (CHAT ONLY) via its OpenAI-compatible endpoint ----
# We reuse the OpenAI starter but point it at Groq's OpenAI-compat base URL for chat.
# Groq does NOT provide an embeddings API, so embeddings use the local transformers
# model below. We exclude OpenAI's embedding auto-configuration to avoid two competing
# EmbeddingModel beans.
# Key comes from the environment / .env (GROQ_API_KEY); never hard-code it here.
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile
spring.autoconfigure.exclude=org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration

# ---- Spring AI: local embeddings (ONNX all-MiniLM-L6-v2, 384-dim, no key) ----
# The transformers starter auto-configures a local EmbeddingModel. Model is downloaded
# once and cached; no network needed after that.

# ---- Spring AI: pgvector vector store ----
# Spring AI auto-creates and owns the `vector_store` table. Do NOT hand-write it.
# It stores embeddings + a metadata JSONB ({chunkId, documentId}) used ONLY as a
# retrieval pre-filter. The authoritative source of truth for chunk content and
# access control stays in document_chunks / document_permissions (see README §5).
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
# all-MiniLM-L6-v2 produces 384-dim vectors. Must match the embedding model.
spring.ai.vectorstore.pgvector.dimensions=384
